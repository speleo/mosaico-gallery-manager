name: Syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Image groups regression checks
        run: php tests/groups.php
      - name: Editor image-group filtering checks
        run: node tests/preview-editor-filter.js
      - name: Navigation registration regression checks
        run: php tests/navigation-menu.php
      - name: Smarty template path regression checks
        run: |
          php tests/template-path.php
      - name: WordPress route and gallery pagination regression
        run: node tests/pagination-route.js
      - name: JavaScript syntax
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check
