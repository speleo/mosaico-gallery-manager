# Run complete validation when a change is proposed, and when a release
# version or this workflow is changed on main. Do NOT run on every intermediate
# source-file commit: the GitHub Contents API commits files one at a time.
name: Extension validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - info.xml
      - .github/workflows/syntax-check.yml
  workflow_dispatch:

# If a newer validation supersedes a queued/running one, only the newer run
# matters. GitHub may still report a completed failed release, appropriately.
concurrency:
  group: extension-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: PHP, JavaScript and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Existing-install group migration checks
        run: php tests/group-upgrade.php
      - name: Image groups regression checks
        run: php tests/groups.php
      - name: Automatic usage-index freshness checks
        run: php tests/usage-freshness.php
      - name: Usage reference counting and persistence checks
        run: php tests/usage-scan.php
      - name: Editor image-group filtering checks
        run: node tests/preview-editor-filter.js
      - name: Navigation registration regression checks
        run: php tests/navigation-menu.php
      - name: Smarty template path regression checks
        run: php tests/template-path.php
      - name: WordPress route and gallery pagination regression
        run: node tests/pagination-route.js
      - name: JavaScript syntax
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check
